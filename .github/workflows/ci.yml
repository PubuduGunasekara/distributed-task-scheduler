name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '21'
  REGISTRY:     ghcr.io
  IMAGE_NAME:   ${{ github.repository }}

# ============================================================
# JOB 1 — Build, test, enforce coverage
# ============================================================
jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    # PostgreSQL service container for @SpringBootTest tests
    # (Testcontainers handles Redis and PostgreSQL for slice tests,
    #  but RedisDistributedLockTest uses @SpringBootTest which needs
    #  a real PostgreSQL for Flyway + JPA context startup)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       taskscheduler
          POSTGRES_USER:     taskscheduler
          POSTGRES_PASSWORD: taskscheduler
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version:  ${{ env.JAVA_VERSION }}
          distribution:  temurin
          cache:         maven    # caches ~/.m2 between runs

      - name: Build, test and enforce 80% coverage
        run: ./mvnw clean verify --batch-mode
        env:
          # Matches application.yml defaults — service container provides these
          DB_HOST:                  localhost
          DB_PORT:                  5432
          DB_NAME:                  taskscheduler
          DB_USER:                  taskscheduler
          DB_PASSWORD:              taskscheduler
          # Testcontainers overrides Redis for integration tests.
          # This value is the fallback for @SpringBootTest context startup.
          REDIS_HOST:               localhost
          REDIS_PORT:               6379
          REDIS_PASSWORD:           ""
          # Kafka is not available in CI — fail-fast: false in application.yml
          # means the app starts without it. No Kafka-dependent @SpringBootTest exists.
          KAFKA_BOOTSTRAP_SERVERS:  localhost:9092

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()   # upload even on failure — needed to diagnose broken builds
        with:
          name:           test-reports-${{ github.run_number }}
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 14

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name:           coverage-report-${{ github.run_number }}
          path:           target/site/jacoco/index.html
          retention-days: 14

  # ============================================================
  # JOB 2 — Docker build and push
  # Only runs after all tests pass.
  # Only pushes on merge to main (not on PRs).
  # ============================================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs:   test           # blocked until test job succeeds
    permissions:
      contents: read
      packages: write       # required for ghcr.io push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache:        maven

      - name: Build JAR (skip tests — already passed in job 1)
        run: ./mvnw clean package -DskipTests --batch-mode -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # Only authenticate on main branch — PRs don't push images
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # sha-abc1234 — immutable, used for deployment rollbacks
            type=sha,prefix=sha-
            # branch name — e.g. main
            type=ref,event=branch
            # latest — only on main branch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context:   .
          # push: true only on main. PRs build but don't push.
          push:      ${{ github.ref == 'refs/heads/main' }}
          tags:      ${{ steps.meta.outputs.tags }}
          labels:    ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # GitHub Actions cache makes layer caching work across runs
          cache-from: type=gha
          cache-to:   type=gha,mode=max