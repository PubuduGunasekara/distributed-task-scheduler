spring:
  application:
    name: distributed-task-scheduler

  threads:
    virtual:
      enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

  jackson:
    serialization:
      write-dates-as-timestamps: false

  mvc:
    problemdetails:
      enabled: true

  datasource:
    url:      jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskscheduler}
    username: ${DB_USER:taskscheduler}
    password: ${DB_PASSWORD:taskscheduler}
    hikari:
      maximum-pool-size:  10
      minimum-idle:       5
      connection-timeout: 30000
      idle-timeout:       600000
      max-lifetime:       1800000
      pool-name:          TaskSchedulerPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql:     false
    open-in-view: false
    properties:
      hibernate:
        dialect:    org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled:             true
    locations:           classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      host:     ${REDIS_HOST:localhost}
      port:     ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 10
          max-idle:   5
          min-idle:   2
          max-wait:   2000ms

# Root-level kafka — intentionally NOT under spring:
# Our KafkaConsumerConfig and KafkaProducerConfig configure
# deserialization programmatically. Moving this under spring.kafka.*
# causes Spring Kafka to see BOTH programmatic and property-based
# configuration simultaneously, which it refuses with:
# "JsonDeserializer must be configured with property setters,
#  or via configuration properties; not both"
kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  admin:
    fail-fast:         false
    operation-timeout: 30
  properties:
    request.timeout.ms:     30000
    default.api.timeout.ms: 30000
  producer:
    key-serializer:   org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    acks:    all
    retries: 3
    properties:
      enable.idempotence:                    true
      max.in.flight.requests.per.connection: 5
  consumer:
    group-id:           ${spring.application.name}
    auto-offset-reset:  earliest
    key-deserializer:   org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    enable-auto-commit: false
    properties:
      spring.json.trusted.packages: "com.taskscheduler.*"

server:
  port:     ${SERVER_PORT:8080}
  shutdown: graceful

management:
  health:
    kafka:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details:    always
      show-components: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

logging:
  level:
    root:              INFO
    com.taskscheduler: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{40} - %msg%n"

# ===== RATE LIMITING =====
rate-limit:
  enabled:             true
  requests-per-window: 10
  window-seconds:      60